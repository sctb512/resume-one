name: Build and release Resume One

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_update_tag:
        description: 'Verify an already published update on both native platforms'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: resume-one-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_STRIP: none
  RESUME_ONE_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  test:
    if: ${{ !inputs.verify_update_tag }}
    uses: ./.github/workflows/ci.yml

  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS-arm64
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            platform: macOS-x64
            target: x86_64-apple-darwin
            arch: x64
          - os: windows-2025
            platform: Windows-x64
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-11-arm
            platform: Windows-arm64
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: rustup target add ${{ matrix.target }}
      - name: Prepare Xcode and Rust
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup show active-toolchain
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
      - name: Test the updater on the native runner
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_PROFILE_TEST_STRIP: none
        run: cargo test --locked -p resume-one-updater --target ${{ matrix.target }}
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          bash packaging/macos/bundle.sh release "$GITHUB_WORKSPACE/dist/Resume One.app"
          bash packaging/macos/archive.sh release \
            "$GITHUB_WORKSPACE/dist/Resume-One-${{ matrix.platform }}-unsigned.zip" \
            "$GITHUB_WORKSPACE/dist/Resume One.app"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup show active-toolchain
          ./packaging/windows/bundle.ps1 -Profile release -Architecture ${{ matrix.arch }} -Archive
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -LiteralPath 'target/${{ matrix.target }}/release/Resume-One-${{ matrix.platform }}-unsigned.zip' -Destination dist
      - name: Verify the archive and bundled themes
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          args=()
          if [[ -n "$RESUME_ONE_RELEASE_TAG" ]]; then
            args+=(--release-tag "$RESUME_ONE_RELEASE_TAG")
          fi
          python packaging/verify-release.py "dist/Resume-One-$PLATFORM-unsigned.zip" "${args[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: resume-one-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  macos_universal:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: resume-one-macOS-*
          merge-multiple: true
          path: dist
      - name: Build and verify the universal archive
        run: |
          bash packaging/macos/universal.sh dist/Resume-One-macOS-arm64-unsigned.zip \
            dist/Resume-One-macOS-x64-unsigned.zip "$PWD/dist/Resume-One-macOS-universal-unsigned.zip"
          python3 packaging/verify-release.py dist/Resume-One-macOS-universal-unsigned.zip --release-tag "$RESUME_ONE_RELEASE_TAG"
      - uses: actions/upload-artifact@v6
        with:
          name: resume-one-macOS-universal
          path: dist/Resume-One-macOS-universal-unsigned.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos_universal
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: resume-one-*
          merge-multiple: true
          path: dist
      - name: Publish all native builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          archives=(
            Resume-One-macOS-arm64-unsigned.zip
            Resume-One-macOS-x64-unsigned.zip
            Resume-One-macOS-universal-unsigned.zip
            Resume-One-Windows-x64-unsigned.zip
            Resume-One-Windows-arm64-unsigned.zip
          )
          sha256sum "${archives[@]}" > SHA256SUMS
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${flags[@]}" --generate-notes \
            "${archives[@]}" SHA256SUMS

  verify_published_update:
    if: ${{ inputs.verify_update_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_STRIP: none
      RESUME_ONE_QA_UPDATE_TAG: ${{ inputs.verify_update_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked -p resume-one-updater --target ${{ matrix.target }} downloads_and_installs_the_public_release -- --ignored
