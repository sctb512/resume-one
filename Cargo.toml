[workspace]
resolver = "2"
members = ["crates/resume-one-core", "crates/resume-one-cli", "crates/resume-one-theme-migrate", "crates/resume-one-app", "crates/resume-one-themes"]
exclude = ["vendor/gpui-component", "vendor/tree-sitter-javascript"]

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
tree-sitter-javascript = { path = "vendor/tree-sitter-javascript" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
jsonschema = { version = "0.56", default-features = false, features = ["arbitrary-precision"] }
sha2 = "0.10"
json-patch = "4.2"
atomic-write-file = "0.3.1"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.27"
docx-rs = "0.4.22"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
printpdf = { version = "0.12.8", default-features = false }
ttf-parser = "0.25.1"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }

# QuickJS parses upstream Handlebars templates at runtime. Keep its C engine
# responsive under the same execution deadline in development and in releases.
[profile.dev.package.rquickjs-sys]
opt-level = 2
