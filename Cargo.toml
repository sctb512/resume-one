[workspace]
resolver = "2"
members = ["crates/resume-one-core", "crates/resume-one-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
jsonschema = { version = "0.56", default-features = false }
sha2 = "0.10"
json-patch = "4.2"
atomic-write-file = "0.3.1"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.27"
docx-rs = "0.4.22"
