[package]
name = "resume-one-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "resume-one-app"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui-component = "=0.5.1"
dirs = "=5.0.1"
sys-locale = "0.3.2"
serde_json.workspace = true
resume-one-core = { path = "../resume-one-core" }
resume-one-themes = { path = "../resume-one-themes" }
resume-one-updater = { path = "../resume-one-updater" }
futures-channel = "=0.3.34"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "=0.53.5", default-features = false, features = ["drag-drop"] }
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility", "NSColorSampler", "NSColor", "NSColorSpace", "block2"] }
block2 = "=0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }
